[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".venv", "venv", "__pycache__", ".git"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort (сортировка импортов)
    "N",   # pep8-naming
    "UP",  # pyupgrade (современный синтаксис)
    "B",   # flake8-bugbear
]
ignore = ["E501"]  # длину строки контролирует форматтер

[tool.ruff.format]
quote-style = "double"